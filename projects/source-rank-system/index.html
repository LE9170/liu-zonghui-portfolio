<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GEO 信源排名系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f2f5;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #333;
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            background: linear-gradient(135deg, #1a73e8, #1557b0);
            color: #fff;
            padding: 28px 0;
            text-align: center;
        }
        .header h1 { font-size: 32px; font-weight: 600; letter-spacing: 2px; }

        /* ===== Tab 导航 ===== */
        .tab-nav {
            display: flex;
            justify-content: center;
            background: #fff;
            border-bottom: 2px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tab-nav button {
            background: none;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-nav button:hover { color: #1a73e8; background: #f8faff; }
        .tab-nav button.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
            font-weight: 600;
        }

        /* ===== 内容容器 ===== */
        .container {
            width: 90%;
            max-width: 1400px;
            margin: 30px auto;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== 卡片 ===== */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 22px;
            color: #111;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        /* ===== 统计摘要 ===== */
        .summary-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .summary-item {
            flex: 1;
            min-width: 160px;
            background: #f8faff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e8edf5;
        }
        .summary-item .num {
            font-size: 32px;
            font-weight: 700;
            color: #1a73e8;
        }
        .summary-item .label {
            font-size: 14px;
            color: #888;
            margin-top: 6px;
        }

        /* ===== 表格 ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            table-layout: fixed;
        }
        thead th {
            background: #f5f7fa;
            color: #555;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }
        thead th.center { text-align: center; }
        tbody td {
            padding: 13px 12px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }
        tbody td.center { text-align: center; }
        tbody tr:hover { background: #f8faff; }
        .rank-num {
            display: inline-block;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 14px;
        }
        .rank-1 { background: #ffd700; color: #8b6914; }
        .rank-2 { background: #c0c0c0; color: #555; }
        .rank-3 { background: #cd7f32; color: #fff; }
        .rank-other { color: #666; }
        .domain-text { font-family: "Consolas", "Courier New", monospace; color: #555; font-size: 13px; }
        .cite-count { font-weight: 600; color: #1a73e8; }
        .percentage-bar {
            display: inline-block;
            height: 8px;
            background: #e8edf5;
            border-radius: 4px;
            overflow: hidden;
            width: 120px;
            vertical-align: middle;
            margin-right: 8px;
        }
        .percentage-bar-fill {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #1a73e8, #4a9ff5);
            border-radius: 4px;
        }

        /* ===== 类型排名 - 可折叠面板 ===== */
        .category-panel {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .category-header {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            cursor: pointer;
            background: #fafbfc;
            transition: background 0.2s;
            user-select: none;
        }
        .category-header:hover { background: #f0f4ff; }
        .category-header .arrow {
            font-size: 12px;
            margin-right: 16px;
            transition: transform 0.2s;
            color: #888;
        }
        .category-header.expanded .arrow { transform: rotate(90deg); }
        .category-header .cat-name {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }
        .category-header .cat-stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
            color: #666;
        }
        .category-header .cat-stats span { white-space: nowrap; }
        .category-header .cat-stats strong { color: #1a73e8; }
        .category-body { display: none; padding: 0 24px 20px; }
        .category-body.open { display: block; }

        /* ===== 子Tab（类型和平台共用） ===== */
        .sub-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .sub-tabs button {
            background: #f5f7fa;
            border: 1px solid #ddd;
            padding: 9px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            font-family: inherit;
            transition: all 0.2s;
        }
        .sub-tabs button:hover { border-color: #1a73e8; color: #1a73e8; }
        .sub-tabs button.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }
        .detail-panel { display: none; }
        .detail-panel.active { display: block; }

        /* ===== 保留平台旧类名兼容 ===== */
        .platform-subtabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .platform-subtabs button {
            background: #f5f7fa;
            border: 1px solid #ddd;
            padding: 9px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            font-family: inherit;
            transition: all 0.2s;
        }
        .platform-subtabs button:hover { border-color: #1a73e8; color: #1a73e8; }
        .platform-subtabs button.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }
        .platform-detail-panel { display: none; }
        .platform-detail-panel.active { display: block; }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state .hint { font-size: 16px; }

        /* ===== 按需加载与分页 ===== */
        [hidden] { display: none !important; }
        .rank-detail .summary-row { margin-bottom: 18px; }
        .loading-state, .error-state {
            text-align: center;
            padding: 36px 20px;
            color: #777;
            font-size: 15px;
        }
        .error-state { color: #c62828; }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
        }
        .pagination button {
            border: 1px solid #d7dce5;
            background: #fff;
            color: #1a73e8;
            border-radius: 6px;
            padding: 7px 16px;
            cursor: pointer;
            font-family: inherit;
        }
        .pagination button:hover:not(:disabled) { background: #f0f5ff; border-color: #1a73e8; }
        .pagination button:disabled { color: #aaa; cursor: not-allowed; background: #f7f7f7; }
        .pagination .page-info { color: #666; font-size: 14px; min-width: 220px; text-align: center; }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .tab-nav button { padding: 12px 24px; font-size: 15px; }
            .container { width: 96%; }
            .card { padding: 16px; }
            .category-header { flex-wrap: wrap; padding: 12px 16px; }
            .category-header .cat-stats { gap: 12px; font-size: 12px; }
            .platform-subtabs button { padding: 8px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>GEO 信源排名系统</h1>
</div>

<!-- ===== Tab 导航 ===== -->
<div class="tab-nav">
    <button class="active" onclick="switchTab('type', this)">📂 类型排名</button>
    <button onclick="switchTab('platform', this)">🤖 平台排名</button>
</div>

<div class="container">

<!-- ========================================== -->
<!-- Tab 1: 类型排名 -->
<!-- ========================================== -->
<div id="tab-type" class="tab-content active">
    <div class="card">
        <h2>类型总览</h2>
        <div class="summary-row">
            <div class="summary-item">
                <div class="num">9</div>
                <div class="label">类型数量</div>
            </div>
            <div class="summary-item">
                <div class="num">19504</div>
                <div class="label">信源总数</div>
            </div>
            <div class="summary-item">
                <div class="num">362695</div>
                <div class="label">总引用次数</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>类型分类</h2>
        <div class="sub-tabs">
    <button class="active" data-key="其他" data-count="16162" data-citations="297125" onclick="switchRankKey('type', this)">其他</button>
<button class="" data-key="教育培训" data-count="1450" data-citations="28492" onclick="switchRankKey('type', this)">教育培训</button>
<button class="" data-key="科技/互联网" data-count="1139" data-citations="24987" onclick="switchRankKey('type', this)">科技/互联网</button>
<button class="" data-key="营销/传媒" data-count="365" data-citations="7159" onclick="switchRankKey('type', this)">营销/传媒</button>
<button class="" data-key="体育/户外" data-count="318" data-citations="4055" onclick="switchRankKey('type', this)">体育/户外</button>
<button class="" data-key="餐饮食品" data-count="53" data-citations="705" onclick="switchRankKey('type', this)">餐饮食品</button>
<button class="" data-key="金融/商业" data-count="2" data-citations="80" onclick="switchRankKey('type', this)">金融/商业</button>
<button class="" data-key="健康/医美" data-count="6" data-citations="51" onclick="switchRankKey('type', this)">健康/医美</button>
<button class="" data-key="制造/工业" data-count="9" data-citations="41" onclick="switchRankKey('type', this)">制造/工业</button>
        </div>

        <div id="type-detail" class="rank-detail">
            <div class="summary-row">
                <div class="summary-item">
                    <div class="num" id="type-current-count">—</div>
                    <div class="label"><span id="type-current-name">当前类型</span> 信源数量</div>
                </div>
                <div class="summary-item">
                    <div class="num" id="type-current-citations">—</div>
                    <div class="label"><span id="type-current-name-citations">当前类型</span> 引用次数</div>
                </div>
            </div>

            <div id="type-loading" class="loading-state">正在加载信源数据…</div>
            <div id="type-error" class="error-state" hidden></div>
            <table id="type-table" hidden>
                <thead>
                    <tr>
                        <th class="center" style="width:70px">排名</th>
                        <th>信源名称</th>
                        <th>域名</th>
                        <th class="center" style="width:110px">引用次数</th>
                        <th style="width:200px">占比</th>
                    </tr>
                </thead>
                <tbody id="type-tbody"></tbody>
            </table>
            <div id="type-pagination" class="pagination" hidden></div>
        </div>
    </div>
    
</div>

<!-- ========================================== -->
<!-- Tab 2: 平台排名 -->
<!-- ========================================== -->
<div id="tab-platform" class="tab-content">
    <div class="card">
        <h2>平台总览</h2>
        <div class="summary-row">
            <div class="summary-item">
                <div class="num">8</div>
                <div class="label">平台数量</div>
            </div>
            <div class="summary-item">
                <div class="num">19504</div>
                <div class="label">信源总数</div>
            </div>
            <div class="summary-item">
                <div class="num">362695</div>
                <div class="label">总引用次数</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>平台信源详情</h2>
        <div class="platform-subtabs">
    <button class="active" data-key="wenxin" data-count="5101" data-citations="93953" onclick="switchRankKey('platform', this)">wenxin</button>
<button class="" data-key="deepseek" data-count="5543" data-citations="67841" onclick="switchRankKey('platform', this)">deepseek</button>
<button class="" data-key="qianwen" data-count="2315" data-citations="64128" onclick="switchRankKey('platform', this)">qianwen</button>
<button class="" data-key="doubao" data-count="5458" data-citations="49699" onclick="switchRankKey('platform', this)">doubao</button>
<button class="" data-key="kimi" data-count="3476" data-citations="39645" onclick="switchRankKey('platform', this)">kimi</button>
<button class="" data-key="glm" data-count="3007" data-citations="24489" onclick="switchRankKey('platform', this)">glm</button>
<button class="" data-key="yuanbao" data-count="2561" data-citations="14202" onclick="switchRankKey('platform', this)">yuanbao</button>
<button class="" data-key="nami" data-count="739" data-citations="8738" onclick="switchRankKey('platform', this)">nami</button>
        </div>

        <div id="platform-detail" class="rank-detail">
            <div class="summary-row">
                <div class="summary-item">
                    <div class="num" id="platform-current-count">—</div>
                    <div class="label"><span id="platform-current-name">当前平台</span> 信源数量</div>
                </div>
                <div class="summary-item">
                    <div class="num" id="platform-current-citations">—</div>
                    <div class="label"><span id="platform-current-name-citations">当前平台</span> 引用次数</div>
                </div>
            </div>

            <div id="platform-loading" class="loading-state">正在加载信源数据…</div>
            <div id="platform-error" class="error-state" hidden></div>
            <table id="platform-table" hidden>
                <thead>
                    <tr>
                        <th class="center" style="width:70px">排名</th>
                        <th>信源名称</th>
                        <th>域名</th>
                        <th class="center" style="width:110px">引用次数</th>
                        <th style="width:200px">占比</th>
                    </tr>
                </thead>
                <tbody id="platform-tbody"></tbody>
            </table>
            <div id="platform-pagination" class="pagination" hidden></div>
        </div>
    </div>
    

</div>

</div><!-- .container -->

<script>
var rankState = {
    type: { key: '', page: 1, pageSize: 100, requestId: 0 },
    platform: { key: '', page: 1, pageSize: 100, requestId: 0 }
};

function switchTab(tab, btn) {
    document.querySelectorAll('.tab-nav button').forEach(function(button) {
        button.classList.remove('active');
    });
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(function(content) {
        content.classList.remove('active');
    });
    document.getElementById('tab-' + tab).classList.add('active');

    if (!rankState[tab].key) {
        var selector = tab === 'type' ? '#tab-type .sub-tabs button' : '#tab-platform .platform-subtabs button';
        var firstButton = document.querySelector(selector);
        if (firstButton) switchRankKey(tab, firstButton);
    }
}

function switchRankKey(dimension, btn) {
    var tabSelector = dimension === 'type' ? '#tab-type .sub-tabs button' : '#tab-platform .platform-subtabs button';
    document.querySelectorAll(tabSelector).forEach(function(button) {
        button.classList.remove('active');
    });
    btn.classList.add('active');

    var state = rankState[dimension];
    state.key = btn.dataset.key;
    state.page = 1;
    document.getElementById(dimension + '-current-count').textContent = btn.dataset.count;
    document.getElementById(dimension + '-current-citations').textContent = btn.dataset.citations;
    document.getElementById(dimension + '-current-name').textContent = state.key;
    document.getElementById(dimension + '-current-name-citations').textContent = state.key;
    loadRankPage(dimension);
}

function loadRankPage(dimension) {
    var state = rankState[dimension];
    var requestId = ++state.requestId;
    var loading = document.getElementById(dimension + '-loading');
    var error = document.getElementById(dimension + '-error');
    var table = document.getElementById(dimension + '-table');
    var pagination = document.getElementById(dimension + '-pagination');

    loading.hidden = false;
    error.hidden = true;
    table.hidden = true;
    pagination.hidden = true;

    getRankData().then(function(data) {
        if (requestId !== state.requestId) return;
        var rows = dimension === 'type'
            ? data.categories[state.key].sources
            : data.platforms[state.key];
        var totalItems = rows.length;
        var totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));
        state.page = Math.max(1, Math.min(state.page, totalPages));
        var from = (state.page - 1) * state.pageSize;
        var page = {
            page: state.page,
            totalPages: totalPages,
            totalItems: totalItems,
            items: rows.slice(from, from + state.pageSize).map(function(row) {
                return { rank: Number(row[0]), name: row[1], domain: row[2], citations: Number(row[3]), percentage: row[4] };
            })
        };
        renderRankRows(dimension, page.items);
        renderPagination(dimension, page);
        loading.hidden = true;
        table.hidden = false;
        pagination.hidden = false;
    }).catch(function(reason) {
        if (requestId !== state.requestId) return;
        loading.hidden = true;
        error.textContent = reason.message || '数据加载失败，请刷新重试';
        error.hidden = false;
    });
}

var rankDataPromise;
function getRankData() {
    if (!rankDataPromise) {
        rankDataPromise = fetch('rank-data.json').then(function(response) {
            if (!response.ok) throw new Error('数据加载失败');
            return response.json();
        });
    }
    return rankDataPromise;
}

function renderRankRows(dimension, items) {
    var tbody = document.getElementById(dimension + '-tbody');
    tbody.textContent = '';
    var fragment = document.createDocumentFragment();

    items.forEach(function(item) {
        var row = document.createElement('tr');

        var rankCell = document.createElement('td');
        rankCell.className = 'center';
        var rank = document.createElement('span');
        rank.className = 'rank-num ' + (item.rank === 1 ? 'rank-1' : item.rank === 2 ? 'rank-2' : item.rank === 3 ? 'rank-3' : 'rank-other');
        rank.textContent = item.rank;
        rankCell.appendChild(rank);
        row.appendChild(rankCell);

        var nameCell = document.createElement('td');
        var name = document.createElement('strong');
        name.textContent = item.name;
        nameCell.appendChild(name);
        row.appendChild(nameCell);

        var domainCell = document.createElement('td');
        var domain = document.createElement('span');
        domain.className = 'domain-text';
        domain.textContent = item.domain;
        domainCell.appendChild(domain);
        row.appendChild(domainCell);

        var citationsCell = document.createElement('td');
        citationsCell.className = 'center';
        var citations = document.createElement('span');
        citations.className = 'cite-count';
        citations.textContent = item.citations;
        citationsCell.appendChild(citations);
        row.appendChild(citationsCell);

        var percentageCell = document.createElement('td');
        var bar = document.createElement('span');
        bar.className = 'percentage-bar';
        var fill = document.createElement('span');
        fill.className = 'percentage-bar-fill';
        var percentage = parseFloat(item.percentage) || 0;
        fill.style.width = (item.citations > 0 ? Math.max(percentage, 1.5) : 0) + '%';
        bar.appendChild(fill);
        percentageCell.appendChild(bar);
        percentageCell.appendChild(document.createTextNode(item.percentage));
        row.appendChild(percentageCell);

        fragment.appendChild(row);
    });
    tbody.appendChild(fragment);
}

function renderPagination(dimension, page) {
    var container = document.getElementById(dimension + '-pagination');
    container.textContent = '';

    var previous = document.createElement('button');
    previous.type = 'button';
    previous.textContent = '上一页';
    previous.disabled = page.page <= 1;
    previous.onclick = function() { goToPage(dimension, page.page - 1); };

    var info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = '第 ' + page.page + ' / ' + page.totalPages + ' 页，共 ' + page.totalItems + ' 条';

    var next = document.createElement('button');
    next.type = 'button';
    next.textContent = '下一页';
    next.disabled = page.page >= page.totalPages;
    next.onclick = function() { goToPage(dimension, page.page + 1); };

    container.appendChild(previous);
    container.appendChild(info);
    container.appendChild(next);
}

function goToPage(dimension, page) {
    rankState[dimension].page = page;
    loadRankPage(dimension);
    document.getElementById(dimension + '-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('DOMContentLoaded', function() {
    var firstType = document.querySelector('#tab-type .sub-tabs button');
    if (firstType) switchRankKey('type', firstType);
});

</script>

</body>
</html>
